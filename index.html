<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scontrini">
<meta name="theme-color" content="#F2F2F0">
<title>Scontrini</title>
<style>
:root{
  --bg:#F2F2F0; --card:#FFFFFF; --ink:#2F403D; --ink2:#4E5C59; --line:#E4E1DA; --fill:#ECEBE6; --err:#C2410C;
  --grad:#D9D6B4;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);overflow:hidden;position:relative}
.blob{position:fixed;left:-15%;right:-15%;top:-80px;height:560px;display:none}
form{position:relative;width:100%;max-width:360px;background:var(--card);border-radius:28px;padding:28px 22px 22px;display:grid;gap:16px;box-shadow:0 12px 40px rgba(47,64,61,.12)}
.logo{width:56px;height:56px;border-radius:16px;background:var(--grad);display:grid;place-items:center}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
p{color:var(--ink2);font-size:15px;line-height:1.4}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--fill);color:var(--ink);outline:0}
input[type=password]:focus{border-color:#2F403D;background:var(--card)}
label{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink2)}
label input{width:20px;height:20px;accent-color:#2F403D}
button{font:inherit;font-size:17px;font-weight:600;padding:15px;border:0;border-radius:14px;background:var(--ink);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible{outline:2px solid #2F403D;outline-offset:2px}
.err{color:var(--err);font-size:14px;min-height:1.2em}
</style>
</head>
<body>
<div class="blob"></div>
<form id="f" hidden>
  <div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2F403D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></div>
  <div style="display:grid;gap:6px"><h1>Scontrini</h1><p>Prototipo riservato. Inserisci la password per aprirlo.</p></div>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
  <label><input id="ricorda" type="checkbox" checked> Ricorda su questo telefono</label>
  <button id="vai" type="submit">Apri</button>
  <div class="err" id="err" role="alert"></div>
</form>

          try { localStorage.setItem(K, enc(raw)); } catch (e) {}
          return key;
        });
      });
    }).then(apri).catch(function () {
      err.textContent = 'Password errata. Riprova.';
      vai.disabled = false; vai.textContent = 'Apri';
    });
  });
})();
